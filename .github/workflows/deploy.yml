name: Build and Deploy Frontend

on:
  push:
    branches: [ main ]

jobs:
  # Part 1: Build image and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/project-01-anti-fakenews-cn-unique:latest


  deploy:
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Aliyun Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ALIYUN_HOST }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          key: ${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

            /usr/bin/docker-compose -f /root/compose/docker-compose-frontend.yml pull

            /usr/bin/docker-compose -f /root/compose/docker-compose-frontend.yml up -d

            docker image prune -af